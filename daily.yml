name: Daily Stock Scan

on:
  schedule:
    - cron: '15 3 * * 1-5'      # 9:15 AM IST, Mon-Fri
    - cron: '30 9 * * 1-5'      # 3:00 PM IST, Mon-Fri
  workflow_dispatch:            # manual "Run workflow" button

permissions:
  contents: write               # lets the job save its memory (state.json) back to the repo

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python daily_scan.py
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO:   ${{ secrets.EMAIL_TO }}
      - name: Save model memory
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add state.json
          git commit -m "update holdings state" || echo "no state change"
          git push || echo "nothing to push"
